[project]
name = "agent-team-v5-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.115",
  "deepagents>=0.3",
  "httpx>=0.27",
  "langchain-openai>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "temporalio>=1.7",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
agent-team-v5 = "agent_team_v5.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
