[project]
name = "asterism-worker"
version = "0.1.5"
requires-python = ">=3.12"
dependencies = [
  "asterism-agent-service",
  "claude-agent-sdk>=0.2.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "temporalio>=1.7",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
asterism-worker = "asterism_worker.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
asterism-agent-service = { path = "../agent-service" }
