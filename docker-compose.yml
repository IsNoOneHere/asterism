services:
  postgres:
    profiles: ["docker-db", "prod"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asterism
      POSTGRES_USER: asterism
      POSTGRES_PASSWORD: ${V5_DB_PASSWORD:?必须设置 V5_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    profiles: ["prod"]
    image: temporalio/temporal@sha256:906f9765cde508333ef191aab908bc724657b5f736cb5ead13921d9a45b33622
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent-service:
    profiles: ["llm", "prod"]
    build:
      context: ./agent-service
    restart: unless-stopped
    environment:
      V5_AGENT_MODEL: ${V5_AGENT_MODEL:-gpt-4.1-mini}
      V5_AGENT_BASE_URL: ${V5_AGENT_BASE_URL:-}
      V5_AGENT_API_KEY: ${V5_AGENT_API_KEY:-}
      V5_AGENT_CONTROL_PLANE_URL: ${V5_AGENT_CONTROL_PLANE_URL:-http://host.docker.internal:8085}
      V5_AGENT_WORKER_CALLBACK_TOKEN: ${V5_WORKER_CALLBACK_TOKEN:?必须设置 V5_WORKER_CALLBACK_TOKEN}
      # 仅外网模型请求走可选代理，容器内服务保持直连。
      HTTP_PROXY: ${V5_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${V5_OUTBOUND_PROXY_URL:-}
      http_proxy: ${V5_OUTBOUND_PROXY_URL:-}
      https_proxy: ${V5_OUTBOUND_PROXY_URL:-}
      NO_PROXY: ${V5_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,temporal,agent-service,control-plane}
      no_proxy: ${V5_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,temporal,agent-service,control-plane}
    ports:
      - "127.0.0.1:8090:8090"

  control-plane:
    profiles: ["prod"]
    build:
      context: ./control-plane
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: temporal,llm
      V5_DB_URL: jdbc:postgresql://postgres:5432/asterism?stringtype=unspecified&currentSchema=control_plane_v5,public
      V5_DB_USER: ${V5_DB_USER:-asterism}
      V5_DB_PASSWORD: ${V5_DB_PASSWORD:?必须设置 V5_DB_PASSWORD}
      V5_WORKER_CALLBACK_TOKEN: ${V5_WORKER_CALLBACK_TOKEN:?必须设置 V5_WORKER_CALLBACK_TOKEN}
      V5_ADMIN_INITIAL_PASSWORD: ${V5_ADMIN_INITIAL_PASSWORD:-}
      V5_TEMPORAL_TARGET: temporal:7233
      V5_TEMPORAL_NAMESPACE: ${V5_TEMPORAL_NAMESPACE:-default}
      V5_TEMPORAL_TASK_QUEUE: ${V5_TEMPORAL_TASK_QUEUE:-asterism}
      V5_PRODUCT_AGENT_URL: http://agent-service:8090/prd-draft
      V5_IMAGE_ANALYSIS_URL: http://agent-service:8090/analyze-image
      V5_ATTACHMENT_ROOT: /app/runtime/attachments
      V5_PROFILE: prod
      ASTERISM_GITLAB_BASE_URL: ${ASTERISM_GITLAB_BASE_URL:-}
      ASTERISM_GITLAB_TOKEN: ${ASTERISM_GITLAB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      agent-service:
        condition: service_started
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - control-plane-attachments:/app/runtime/attachments

  worker:
    profiles: ["prod"]
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      V5_PROFILE: prod
      V5_TEMPORAL_TARGET: temporal:7233
      V5_TEMPORAL_NAMESPACE: ${V5_TEMPORAL_NAMESPACE:-default}
      V5_TEMPORAL_TASK_QUEUE: ${V5_TEMPORAL_TASK_QUEUE:-asterism}
      V5_CONTROL_PLANE_URL: http://control-plane:8085
      V5_WORKER_CALLBACK_TOKEN: ${V5_WORKER_CALLBACK_TOKEN:?必须设置 V5_WORKER_CALLBACK_TOKEN}
      V5_EXECUTION_ENGINE: http
      V5_EXECUTION_HTTP_ENDPOINT: http://agent-service:8090/execute
      V5_MODEL_PROVIDER: ${V5_MODEL_PROVIDER:-anthropic}
      V5_MODEL_API_KEY: ${V5_MODEL_API_KEY:-}
      V5_MODEL_BASE_URL: ${V5_MODEL_BASE_URL:-}
      V5_MODEL: ${V5_MODEL:-}
      V5_ENGINE_MAX_TURNS: ${V5_ENGINE_MAX_TURNS:-50}
      V5_ENGINE_TIMEOUT_SECONDS: ${V5_ENGINE_TIMEOUT_SECONDS:-600}
      V5_ENGINE_EFFORT_LEVEL: ${V5_ENGINE_EFFORT_LEVEL:-}
      # 旧变量只作升级兼容，应用内已统一解析成一个默认 Profile/EngineConfig。
      V5_ANTHROPIC_API_KEY: ${V5_ANTHROPIC_API_KEY:-}
      V5_ANTHROPIC_BASE_URL: ${V5_ANTHROPIC_BASE_URL:-}
      V5_ANTHROPIC_MODEL: ${V5_ANTHROPIC_MODEL:-}
      V5_CLAUDE_CODE_EFFORT_LEVEL: ${V5_CLAUDE_CODE_EFFORT_LEVEL:-}
      V5_CLAUDE_MAX_TURNS: ${V5_CLAUDE_MAX_TURNS:-50}
      V5_ARTIFACTS_ROOT: /app/runtime/artifacts
      V5_PLANNER_PROVIDER: http
      V5_PLANNER_HTTP_ENDPOINT: http://agent-service:8090/plan
      V5_AGENT_SERVICE_URL: http://agent-service:8090
      V5_RELEASE_PUSH: ${V5_RELEASE_PUSH:-false}
      V5_WORKSPACE_ROOT: /tmp/asterism-workspaces
      V5_PUBLIC_URL: ${V5_PUBLIC_URL:-http://127.0.0.1:8080}
      # Claude SDK 与 HTTP provider 共用同一出站代理设置。
      HTTP_PROXY: ${V5_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${V5_OUTBOUND_PROXY_URL:-}
      http_proxy: ${V5_OUTBOUND_PROXY_URL:-}
      https_proxy: ${V5_OUTBOUND_PROXY_URL:-}
      NO_PROXY: ${V5_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,temporal,agent-service,control-plane}
      no_proxy: ${V5_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,temporal,agent-service,control-plane}
    volumes:
      - ${V5_REPO_ROOT:-/tmp}:/repos
      - ${V5_REPO_ROOT:-/tmp}:${V5_REPO_ROOT:-/tmp}
      - worker-artifacts:/app/runtime/artifacts
    depends_on:
      - control-plane
      - temporal
      - agent-service

  workbench:
    profiles: ["prod"]
    build:
      context: ./workbench
    restart: unless-stopped
    environment:
      V5_CONTROL_PLANE_HOST: control-plane
    depends_on:
      - control-plane
    ports:
      - "8080:80"

volumes:
  postgres-data:
  temporal-data:
  control-plane-attachments:
  worker-artifacts:
